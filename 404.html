<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#020208" />
  <title>Page not found | Kristina Glišović</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="32x32" />
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020208;
      color: #f4f7ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 18% 18%, rgba(99, 102, 241, .16), transparent 32rem),
        radial-gradient(circle at 82% 78%, rgba(34, 211, 238, .1), transparent 28rem),
        #020208;
    }
    main {
      width: min(100%, 44rem);
      padding: clamp(2rem, 7vw, 4.5rem);
      border: 1px solid rgba(255, 255, 255, .11);
      border-radius: 1.75rem;
      background: linear-gradient(145deg, rgba(255, 255, 255, .065), rgba(255, 255, 255, .018));
      box-shadow: 0 2rem 6rem rgba(0, 0, 0, .36);
      text-align: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: clamp(2.25rem, 7vw, 4rem);
      color: inherit;
      font-weight: 650;
      text-decoration: none;
    }
    .brand-mark {
      display: grid;
      width: 2.75rem;
      height: 2.75rem;
      place-items: center;
      border: 1px solid rgba(129, 140, 248, .45);
      border-radius: .9rem;
      background: linear-gradient(135deg, rgba(99, 102, 241, .28), rgba(34, 211, 238, .14));
      color: #c7d2fe;
      font-size: .78rem;
      letter-spacing: .08em;
    }
    .code {
      margin: 0 0 .75rem;
      color: #818cf8;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 9vw, 4.8rem);
      line-height: 1.02;
      letter-spacing: -.055em;
    }
    .message {
      max-width: 31rem;
      margin: 1.25rem auto 0;
      color: #9aa8bc;
      font-size: clamp(1rem, 2.5vw, 1.1rem);
      line-height: 1.7;
    }
    .message-sr {
      margin-top: .65rem;
      color: #74849a;
      font-size: .9rem;
    }
    .home-link {
      min-height: 2.75rem;
      margin-top: 2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: .8rem 1.25rem;
      border-radius: .85rem;
      background: linear-gradient(135deg, #6366f1, #22d3ee);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 .75rem 2rem rgba(99, 102, 241, .25);
    }
    :focus-visible {
      outline: 3px solid #67e8f9;
      outline-offset: 4px;
    }
    @media (max-width: 30rem) {
      main { padding-inline: 1.35rem; border-radius: 1.35rem; }
      .brand { margin-bottom: 2.25rem; }
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="Kristina Glišović - back to homepage">
      <span class="brand-mark" aria-hidden="true">ER</span>
      <span>Kristina Glišović</span>
    </a>
    <p class="code">Error 404</p>
    <h1>Page not found.</h1>
    <p class="message">The page you’re looking for doesn’t exist or may have moved.</p>
    <p class="message message-sr" lang="sr-Latn">Stranica koju tražite ne postoji ili je možda premeštena.</p>
    <a class="home-link" href="/">Back to homepage</a>
  </main>
</body>
</html>
