<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Kristina Glišović — Shopify &amp; Web Solutions Developer</title>
  <desc id="description">Dark portfolio social preview with violet and cyan accents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020208" />
      <stop offset="0.58" stop-color="#07070f" />
      <stop offset="1" stop-color="#0c0c18" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="0.52" stop-color="#6366f1" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientTransform="translate(220 125) rotate(35) scale(470 370)">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientTransform="translate(1030 520) rotate(205) scale(500 370)">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.035" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#000000" flood-opacity="0.46" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <rect width="1200" height="630" fill="url(#glowViolet)" />
  <rect width="1200" height="630" fill="url(#glowCyan)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <rect x="52" y="52" width="1096" height="526" rx="42" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.10" filter="url(#shadow)" />
  <rect x="53" y="53" width="1094" height="3" rx="1.5" fill="url(#accent)" fill-opacity="0.9" />

  <g transform="translate(112 108)">
    <rect width="68" height="68" rx="20" fill="url(#accent)" />
    <path d="M24 18v32M24 34l21-17M24 34l22 17" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="112" y="278" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="-2">Kristina Glišović</text>
  <text x="112" y="372" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="600" letter-spacing="-1.2">Shopify &amp; Web Solutions</text>
  <text x="112" y="438" fill="url(#accent)" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="600" letter-spacing="-1.2">Developer</text>

  <rect x="112" y="505" width="210" height="2" rx="1" fill="url(#accent)" />
  <circle cx="1090" cy="512" r="5" fill="#22d3ee" />
</svg>
